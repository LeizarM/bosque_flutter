name: bosque_flutter
description: "Bosque"
publish_to: 'none'
version: 1.0.4

environment:
  sdk: ^3.7.2

dependencies:
  awesome_snackbar_content: ^0.1.1
  calendar_date_picker2: 2.0.0
  connectivity_plus: ^7.0.0
  dio: ^5.8.0+1
  dropdown_search: ^5.0.6
  excel: ^4.0.6
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_file_dialog: ^3.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_map: ^8.1.1
  flutter_map_cancellable_tile_provider: ^3.1.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_speed_dial: ^7.0.0
  flutter_svg: ^1.1.6
  geocoding: ^3.0.0
  geolocator: ^14.0.0
  get_it: ^8.0.3
  go_router: ^14.8.1
  graphview: ^1.5.0
  http: ^1.2.1
  http_parser: any
  image_picker: ^1.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  latlong2: ^0.9.1
  logger: ^2.5.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  phone_numbers_parser: ^8.0.0
  pluto_grid: ^8.0.0
  printing: ^5.14.2
  responsive_framework: ^1.5.1
  shared_preferences: ^2.5.3
  universal_html: ^2.2.4
  url_launcher: ^6.3.1
dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/icon/
    - assets/icon/whatsapp.png

  # Declarar la familia 'Roboto' aca tapa la Roboto que trae el motor, asi que
  # hay que registrar TODOS los pesos que la app pide. Con solo el Regular,
  # Skia no sintetiza: pedir w700 devuelve el mismo trazo que w400 y las
  # negritas y cursivas del tema quedan invisibles en toda la app.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

    # Tipografia del modulo de Comisiones. No se cambia la de la app: el modulo
    # se envuelve en su propio Theme, asi el resto del sistema queda intacto.
    #
    # Plus Jakarta Sans en la interfaz. Roboto es la tipografia por defecto de
    # Android y se lee como "pantalla sin disenar"; esta tiene la misma
    # legibilidad en 11px pero con caracter propio.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700

    # JetBrains Mono SOLO para importes. Ancho fijo de verdad: las columnas de
    # plata alinean por construccion y el 0 va con barra, asi que no se
    # confunde con la O al revisar un numero de nota.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
